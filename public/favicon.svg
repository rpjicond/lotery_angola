<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fundo Corporativo LVA -->
  <rect width="32" height="32" rx="4" fill="#0B2C69"/>
  
  <!-- Passaporte 1 (Azul marinho com detalhe dourado) -->
  <g transform="rotate(-8 12 16)">
    <rect x="5" y="7" width="13" height="18" rx="1.5" fill="#071A40" stroke="#FBBF24" stroke-width="0.75"/>
    <circle cx="11.5" cy="14" r="2.5" fill="none" stroke="#FBBF24" stroke-width="0.75"/>
    <line x1="8" y1="21" x2="15" y2="21" stroke="#FBBF24" stroke-width="0.75" stroke-linecap="round"/>
  </g>
  
  <!-- Passaporte 2 (Dourado Oficial Angola AO) -->
  <g transform="rotate(8 20 16)">
    <rect x="14" y="7" width="13" height="18" rx="1.5" fill="#FBBF24" stroke="#D97706" stroke-width="0.75"/>
    <text x="20.5" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="6.5" fill="#0B2C69" text-anchor="middle" letter-spacing="-0.5">AO</text>
    <rect x="17" y="19" width="7" height="1" rx="0.5" fill="#0B2C69"/>
  </g>
</svg>
